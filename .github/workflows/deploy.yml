name: deploy

# Two jobs, two trust levels:
#
#   fetch   holds the GitHub App token, runs no repository code (checkout only)
#   deploy  holds VERCEL_TOKEN, runs no repository code (uploads source only)
#
# The build itself happens on Vercel's infrastructure, not on this runner. That
# is deliberate: `npm ci` executes student-authored postinstall scripts and
# `next.config.js` is student-authored code, so neither may ever run in a job
# holding VERCEL_TOKEN. Vercel builds in its own sandbox, where the only
# credentials present are that project's own environment variables.
#
# An earlier version built here with `vercel build --prebuilt`. That does not
# work: the Vercel CLI requires authentication even for a local build, which
# would have put the account token in the same job as student code.

on:
  workflow_call:
    inputs:
      key:          { required: true,  type: string }
      repo:         { required: true,  type: string }
      ref:          { required: true,  type: string }
      sha:          { required: true,  type: string }
      project_id:   { required: true,  type: string }
      project_name: { required: true,  type: string }
      root:         { required: false, type: string, default: '.' }
      prod:         { required: false, type: boolean, default: true }

permissions: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.slug.outputs.value }}
    steps:
      - id: slug
        run: echo "value=$(printf '%s-%s' '${{ inputs.repo }}' '${{ inputs.key }}' | tr -c 'A-Za-z0-9._-' '-')" >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@5d869da34e18e7287c1daad50e0b8ea0f506ce69 # v1.11.0
        id: app
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ vars.ORG }}
          repositories: ${{ inputs.repo }}

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ vars.ORG }}/${{ inputs.repo }}
          ref: ${{ inputs.sha }}
          token: ${{ steps.app.outputs.token }}
          path: source
          persist-credentials: false

      - name: Package the source tree
        run: tar --exclude=.git --exclude=node_modules -czf source.tgz -C source .

      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: source-${{ steps.slug.outputs.value }}
          path: source.tgz
          retention-days: 1

  deploy:
    needs: fetch
    runs-on: ubuntu-latest
    environment: production      # gates VERCEL_TOKEN to branch main
    steps:
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - run: npm install --global vercel@latest

      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: source-${{ needs.fetch.outputs.slug }}

      - name: Unpack (extraction only -- nothing from the repo is executed)
        run: |
          mkdir -p source && tar -xzf source.tgz -C source
          mkdir -p 'source/${{ inputs.root }}/.vercel'
          printf '{"projectId":"%s","orgId":"%s"}\n' \
            '${{ inputs.project_id }}' '${{ vars.VERCEL_ORG_ID }}' \
            > 'source/${{ inputs.root }}/.vercel/project.json'

      - name: vercel deploy
        id: vercel
        working-directory: source/${{ inputs.root }}
        run: |
          # Build-time env vars live on the Vercel project (set by the scan job
          # from .deploy.yml), so nothing student-controlled reaches this shell.
          #
          # Keep stdout separate from stderr: the CLI writes ONLY the deployment
          # URL to stdout. Scraping the merged log instead can pick up the
          # "Production:" banner, which may name a hostname owned by a different
          # Vercel account and therefore 404s.
          set +e
          vercel deploy --yes ${{ inputs.prod && '--prod' || '' }} \
            --token "$VERCEL_TOKEN" ${VERCEL_TEAM_ID:+--scope "$VERCEL_TEAM_ID"} \
            >deploy.url 2>deploy.log
          code=$?
          cat deploy.log
          # Keep the log where the result step can read it, on success or failure.
          cp deploy.log "$GITHUB_WORKSPACE/deploy.log" 2>/dev/null || true
          [ $code -eq 0 ] || exit $code
          echo "url=$(tr -d '\r' < deploy.url | grep -E '^https://' | tail -1)" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}

      # The filename must be unique: the record job downloads every result-*
      # artifact with merge-multiple, which flattens them into one directory.
      # A shared inner filename would silently overwrite all but one.
      - name: Write result
        if: always()
        run: |
          node -e '
            const fs = require("node:fs");
            let errorLog = "";
            if (process.env.STATUS !== "success") {
              let raw = "";
              try { raw = fs.readFileSync("deploy.log", "utf8"); } catch {}
              const noise = /^(Vercel CLI|> NOTE:|> https:\/\/vercel\.com\/docs\/cli\/about-telemetry|npm notice|Retrieving project|Inspect:)/;
              errorLog = raw
                .replace(/\x1b\[[0-9;]*[A-Za-z]/g, "")   // strip colour codes
                .split("\n")
                .filter((l) => l.trim() && !noise.test(l.trim()))
                .slice(-45)                               // the tail is where the error is
                .join("\n")
                .slice(-5000);
            }
            fs.writeFileSync(process.env.OUT, JSON.stringify({
              repo: process.env.REPO, key: process.env.KEY, sha: process.env.SHA,
              status: process.env.STATUS, url: process.env.URL || "",
              runUrl: process.env.RUN_URL, errorLog,
            }, null, 2));
          '
        env:
          OUT: result-${{ needs.fetch.outputs.slug }}.json
          REPO: ${{ inputs.repo }}
          KEY: ${{ inputs.key }}
          SHA: ${{ inputs.sha }}
          STATUS: ${{ steps.vercel.outcome == 'success' && 'success' || 'failure' }}
          URL: ${{ steps.vercel.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Job summary
        if: always()
        run: |
          node -e '
            const fs = require("node:fs");
            const r = JSON.parse(fs.readFileSync(process.env.OUT, "utf8"));
            const ok = r.status === "success";
            const body = ok
              ? `### :white_check_mark: ${r.repo} / ${r.key}\n\n${r.url}\n`
              : `### :x: ${r.repo} / ${r.key}\n\n\`\`\`\n${r.errorLog || "no log captured"}\n\`\`\`\n`;
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, body);
          '
        env:
          OUT: result-${{ needs.fetch.outputs.slug }}.json

      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: result-${{ needs.fetch.outputs.slug }}
          path: result-${{ needs.fetch.outputs.slug }}.json
          retention-days: 1
