name: deploy

# Three jobs, three trust levels. This split is the whole security model:
#
#   fetch   holds the GitHub App token, runs no repository code (checkout only)
#   build   holds NO secrets, runs `npm ci` and `vercel build` -- i.e. arbitrary
#           student code, including postinstall hooks and next.config.js
#   deploy  holds VERCEL_TOKEN, runs no repository code (uploads .vercel/output)
#
# Never collapse build and deploy into one job. A malicious postinstall script
# in a student repo would then be able to exfiltrate the Vercel token.

on:
  workflow_call:
    inputs:
      key:          { required: true,  type: string }
      repo:         { required: true,  type: string }
      ref:          { required: true,  type: string }
      sha:          { required: true,  type: string }
      project_id:   { required: true,  type: string }
      project_name: { required: true,  type: string }
      root:         { required: false, type: string, default: '.' }
      node:         { required: false, type: string, default: '22.x' }
      prod:         { required: false, type: boolean, default: true }
      build_env:    { required: false, type: string, default: '{}' }

permissions: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.slug.outputs.value }}
    steps:
      - id: slug
        run: echo "value=$(printf '%s-%s' '${{ inputs.repo }}' '${{ inputs.key }}' | tr -c 'A-Za-z0-9._-' '-')" >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@5d869da34e18e7287c1daad50e0b8ea0f506ce69 # v1.11.0
        id: app
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ vars.ORG }}
          repositories: ${{ inputs.repo }}

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ vars.ORG }}/${{ inputs.repo }}
          ref: ${{ inputs.sha }}
          token: ${{ steps.app.outputs.token }}
          path: source
          persist-credentials: false

      - name: Package the source tree
        run: tar --exclude=.git -czf source.tgz -C source .

      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: source-${{ steps.slug.outputs.value }}
          path: source.tgz
          retention-days: 1

  build:
    needs: fetch
    runs-on: ubuntu-latest
    # No `secrets:` are referenced anywhere in this job. Keep it that way.
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: source-${{ needs.fetch.outputs.slug }}

      - run: mkdir -p source && tar -xzf source.tgz -C source

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ inputs.node }}

      - run: npm install --global vercel@latest

      - name: Link the project without authenticating
        working-directory: source/${{ inputs.root }}
        run: |
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}\n' \
            '${{ inputs.project_id }}' '${{ vars.VERCEL_ORG_ID }}' > .vercel/project.json

      - name: Install dependencies
        working-directory: source/${{ inputs.root }}
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund
          elif [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then corepack enable && yarn install --frozen-lockfile
          elif [ -f package.json ]; then npm install --no-audit --no-fund
          else echo 'static site: nothing to install'; fi

      - name: Export build-time environment
        run: |
          node -e '
            const env = JSON.parse(process.env.BUILD_ENV || "{}");
            const fs = require("node:fs");
            for (const [k, v] of Object.entries(env)) fs.appendFileSync(process.env.GITHUB_ENV, `${k}=${v}\n`);
          '
        env:
          BUILD_ENV: ${{ inputs.build_env }}

      - name: vercel build
        working-directory: source/${{ inputs.root }}
        run: vercel build --yes ${{ inputs.prod && '--prod' || '' }}

      - run: tar -czf output.tgz -C source/${{ inputs.root }}/.vercel output

      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: output-${{ needs.fetch.outputs.slug }}
          path: output.tgz
          retention-days: 1

  deploy:
    needs: [fetch, build]
    if: always() && needs.fetch.result == 'success'
    runs-on: ubuntu-latest
    environment: production      # gate VERCEL_TOKEN behind an environment
    steps:
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        if: needs.build.result == 'success'
        with:
          name: output-${{ needs.fetch.outputs.slug }}

      - name: Unpack prebuilt output
        if: needs.build.result == 'success'
        run: |
          mkdir -p deploy/.vercel && tar -xzf output.tgz -C deploy/.vercel
          printf '{"projectId":"%s","orgId":"%s"}\n' \
            '${{ inputs.project_id }}' '${{ vars.VERCEL_ORG_ID }}' > deploy/.vercel/project.json

      - name: vercel deploy --prebuilt
        if: needs.build.result == 'success'
        id: vercel
        working-directory: deploy
        run: |
          set -o pipefail
          vercel deploy --prebuilt --yes ${{ inputs.prod && '--prod' || '' }} \
            --token "$VERCEL_TOKEN" ${VERCEL_TEAM_ID:+--scope "$VERCEL_TEAM_ID"} \
            | tee deploy.log
          echo "url=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.vercel\.app' deploy.log | tail -1)" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}

      - name: Write result
        if: always()
        run: |
          node -e '
            require("node:fs").writeFileSync("result.json", JSON.stringify({
              repo: process.env.REPO, key: process.env.KEY, sha: process.env.SHA,
              status: process.env.STATUS, url: process.env.URL || "", runUrl: process.env.RUN_URL,
            }, null, 2));
          '
        env:
          REPO: ${{ inputs.repo }}
          KEY: ${{ inputs.key }}
          SHA: ${{ inputs.sha }}
          STATUS: ${{ steps.vercel.outcome == 'success' && 'success' || 'failure' }}
          URL: ${{ steps.vercel.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: result-${{ needs.fetch.outputs.slug }}
          path: result.json
          retention-days: 1
